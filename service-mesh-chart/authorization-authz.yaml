apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ template "application.name" . }}-service-allow-after-authz
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ $.Release.Name }}
    chart: {{ $.Chart.Name }}
    release: "{{ $.Release.Name }}"
spec:
  action: ALLOW
  selector:
    matchLabels:
      {{- toYaml .Values.appSelector.matchLabels | nindent 6 }}
  # An empty 'rules' block here means it applies to all requests that reach it.
  rules:
    - to:
        - operation:
            hosts:
              # Allow requests to the external gateway and all internal services
              - {{ include "aarui.virtualservice_host" . }}
              # Additional app hosts sharing this namespace's auth policies
              {{- range .Values.virtualservice.additionalHosts }}
              - {{ . }}
              {{- end }}
      from:
        # RULE 1: Allow requests from external traffic that have a valid end-user JWT.
        - source:
            requestPrincipals:
              - "{{ .Values.virtualservice.cidp_oauth2_base_url }}/*"
    - from:
        # RULE 2: Allow requests from any other service within the same namespace.
        # This enables secure service-to-service communication.
        - source:
            principals:
              - "cluster.local/ns/{{ .Values.namespace }}/sa/*"
    - from:
        # RULE 3: Allow requests forwarded by the ASM ingress gateway.
        # The gateway pod runs in its own namespace (e.g., asm-gateway),
        # so its SA principal doesn't match the same-namespace rule above.
        - source:
            principals:
              - "cluster.local/ns/asm-gateway/sa/*"