apiVersion: security.istio.io/v1beta1
kind: RequestAuthentication
metadata:
  name: {{ template "application.name" . }}-jwt-auth
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ $.Release.Name }}
    chart: {{ $.Chart.Name }}
    release: "{{ $.Release.Name }}"
spec:
  selector:
    matchLabels:
      {{- toYaml .Values.appSelector.matchLabels | nindent 6 }}
  jwtRules:
    - issuer: {{ .Values.virtualservice.cidp_oauth2_base_url }}
      jwksUri: {{ .Values.virtualService.cidp_oauth2_base_url }}/connect/jwk_uri
      forwardOriginalToken: true
      {{- if .Values.oicdAudience }}
      # Only accept JWTs issued for THIS app's OIDC client ID.
      audiences:
        - {{ .Values.oicdAudience }}
      {{- end }}
      {{- if .Values.virtualservice.audiences }}
      # Legacy: accept tokens for multiple client IDs (shared mode).
      audiences:
        {{- range .Values.virtualservice.audiences }}
        - {{ . }}
        {{- end }}
      {{- end }}
      outputClaimToHeaders:
        - header: Remote-User
          claim: email