# =============================================================================
# Service Mesh Chart — values.yaml
# =============================================================================
# This file provides configuration for all Istio service mesh resources
# deployed as part of the application Helm chart.
# =============================================================================

# -- Application namespace (passed from parent chart or --set)
namespace: uat

# -- Global settings
global:
  isGDC: true   # Enable GDC-specific features (exportTo, ASM gateway)

# -- Kubernetes Service
service:
  type: ClusterIP
  targetPort: 8080

# =============================================================================
# VirtualService Configuration
# =============================================================================
virtualservice:
  # -- ASM Gateway reference (namespace/name format for cross-namespace)
  asmgateways: asm-gateway/asm-gateway

  # -- External hostname served by this VirtualService
  host: myapp.example.gdc.corp

  # -- CIDP / OIDC provider URLs
  cidp_oauth2_base_url: "https://cidp.example.gdc.corp/oauth2"

  # -- OIDC audiences (client IDs) accepted by RequestAuthentication.
  # When multiple apps share a namespace with different OIDC client IDs,
  # list ALL client IDs here so tokens for any app are accepted.
  # Leave empty [] to accept tokens for any audience (less secure).
  audiences: []
    # - client-id-for-release-readiness
    # - client-id-for-new-ui-app

  # -- Additional app hosts sharing this namespace's auth policies.
  # These hosts are added to AuthorizationPolicy ALLOW rules so that
  # requests to these hosts are not blocked with 403.
  additionalHosts: []
    # - newapp.example.gdc.corp
    # - thirdapp.example.gdc.corp

  # Each route maps a URI prefix to a destination service.
  # The VirtualService iterates over this list to generate route rules.
  routes:
    # ── REST API (v1) ──────────────────────────────────────────────
    - name: "rest-api-v1"
      match:
        - uri:
            prefix: /api/v1/
      destination:
        host: rest-api
        port: 8080

    # ── REST API (v2) ──────────────────────────────────────────────
    - name: "rest-api-v2"
      match:
        - uri:
            prefix: /api/v2/
      destination:
        host: rest-api-v2
        port: 8080

    # ── Executive Insights API ─────────────────────────────────────
    - name: "executive-insights-api"
      match:
        - uri:
            prefix: /api/insights/
      destination:
        host: executive-insights-api
        port: 8080

    # ── Reporting Service ──────────────────────────────────────────
    - name: "reporting-service"
      match:
        - uri:
            prefix: /api/reports/
      destination:
        host: reporting-service
        port: 8080

    # ── Notification Service ───────────────────────────────────────
    - name: "notification-service"
      match:
        - uri:
            prefix: /api/notifications/
      destination:
        host: notification-service
        port: 8080

# =============================================================================
# Security Principles — Istio Policy Configuration
# =============================================================================

# -- App-Specific Policy Selector
# Controls which pods THIS chart's auth policies (RequestAuthentication,
# AuthorizationPolicy) apply to. Each app sets its OWN selector so that
# multiple apps can coexist in the same namespace with independent policies.
#
# SHARED policies (deny-all-default, allow-same-namespace, peer-authentication)
# are namespace-wide and should only be deployed ONCE per namespace.
# Set tenantIsolation.enabled and peerAuthentication.enabled to false
# in App 2's values.yaml if App 1 already deployed them.
appSelector:
  # App 1 example: { app: release-readiness }
  # App 2 example: { app: new-ui-app }
  matchLabels:
    app: release-readiness

# -- OIDC audience (client ID) for THIS app.
# Each app registers its own OIDC client ID with CIDP.
# The RequestAuthentication will only accept JWTs with this audience.
# Leave empty to accept tokens for any audience (less secure).
oicdAudience: ""
  # Example: "my-app-client-id-from-cidp"

# -- Principle 1: Tenant Isolation
# Blocks all traffic from outside this namespace by default,
# then explicitly allows traffic from within the same namespace.
# ⚠️  Deploy ONCE per namespace. Set to false in App 2 if App 1
#     already deployed these policies.
tenantIsolation:
  enabled: true

# -- Principle 2: mTLS
# Enforces mutual TLS for all service-to-service communication.
# Modes: STRICT (production), PERMISSIVE (migration), DISABLE (not recommended)
# ⚠️  Deploy ONCE per namespace. Set to false in App 2 if App 1
#     already deployed this policy.
peerAuthentication:
  enabled: true
  mtlsMode: STRICT    # Change to PERMISSIVE during migration

# -- Principle 3: CIDP / OIDC Token Validation
# Validates JWT tokens from the Cloud Identity Provider.
# Uses appSelector to target ONLY this app's pods.
requestAuthentication:
  enabled: true

# -- Principle 4: Service-to-Service Allow-Lists
# Controls which services can call which. Uses JWT principals for
# external traffic and ServiceAccount principals for internal traffic.
# Uses appSelector to target ONLY this app's pods.
serviceAllowLists:
  enabled: true

# =============================================================================
# Internal Remote User — Cron Jobs & Service-to-Service Identity
# =============================================================================
# When a request comes through the browser, CIDP/OIDC sets the Remote-User
# header via RequestAuthentication (outputClaimToHeaders). But cron jobs and
# service-to-service calls have no JWT token, so Remote-User is null.
#
# This feature allows internal services to pass identity via a trusted
# header (X-Internal-Remote-User). An EnvoyFilter on the receiving service
# copies it to Remote-User only when:
#   1. No OIDC Remote-User header is already present (browser takes priority)
#   2. The caller is from a trusted service account within the same namespace
#
# Usage:
#   - Cron jobs / batch services set the header:
#       X-Internal-Remote-User: cronjob-scheduler@system
#   - Your app reads Remote-User as usual — it works for both browser
#     and internal callers.
# =============================================================================
internalRemoteUser:
  enabled: true

  # -- Header name used by internal services to pass identity.
  # This header is NOT managed by Istio RequestAuthentication,
  # so Envoy will not strip it from internal traffic.
  headerName: x-internal-remote-user

  # -- The target header that your app reads (set by OIDC for browser traffic).
  # The EnvoyFilter copies internalHeader → targetHeader when targetHeader is empty.
  targetHeader: remote-user

  # -- Service accounts allowed to set the internal remote user header.
  # Only traffic from these SAs will have the header trusted and copied.
  # Use "*" to allow all SAs in the namespace (less secure).
  allowedServiceAccounts:
    - "*"                  # allows all SAs in the namespace
    # For tighter security, replace "*" with specific SAs:
    # - cronjob-scheduler
    # - batch-processor

  # -- Default remote user value for cron jobs that don't set the header.
  # If a request has no OIDC Remote-User AND no X-Internal-Remote-User,
  # this value is automatically set as Remote-User.
  defaultRemoteUser: "system@internal"

